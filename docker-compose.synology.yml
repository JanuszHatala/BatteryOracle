# ==============================================================================
# Synology DSM 7.x Container Manager Deployment Template
# ==============================================================================
# How to use on Synology NAS:
# 1. Open Container Manager > Project > Create.
# 2. Set Project Name: battery-oracle
# 3. Path: /volume1/docker/battery-oracle (create folder if needed)
# 4. Source: Upload this docker-compose.synology.yml (or rename to compose.yaml)
# 5. Place your battery_oracle.db into /volume1/docker/battery-oracle/data/
# 6. Click 'Done' to pull image and launch container.
# ==============================================================================

services:
  battery-oracle:
    image: ghcr.io/januszhatala/batteryoracle:latest
    container_name: battery-oracle
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      - BATTERY_ORACLE_DB_PATH=/app/data/battery_oracle.db
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
